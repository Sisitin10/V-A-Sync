workflows:
  ios-capacitor-workflow:
    name: iOS Unsigned Free IPA Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: | 
          npm install -g bun
          bun install
      - name: Build Web Application
        script: |
          bun run build
      - name: Capacitor Sync
        script: |
          bunx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build Unsigned Native App
        script: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package Unsigned .app to .ipa
        script: |
          mkdir -p Payload
          cp -r $HOME/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/App.app Payload/
          zip -r free_unsigned_build.ipa Payload
          rm -rf Payload
    artifacts:
      - free_unsigned_build.ipa
