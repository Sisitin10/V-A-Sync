workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: | 
          # Using bun since you have a bun.lock file
          npm install -g bun
          bun install
      - name: Build Web Application
        script: |
          bun run build
      - name: Capacitor Sync iOS
        script: |
          bunx cap sync ios
      - name: CocoaPods Installation
        script: |
          cd ios/App && pod install
      - name: Build iOS App (.app / .ipa)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -allowProvisioningUpdates CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Release-iphoneos/*.app
