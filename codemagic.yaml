workflows:
  ios-unsigned:
    name: iOS Unsigned IPA Build
    instance_type: mac_mini_m2
    scripts:
      - name: Build Unsigned App
        script: |
          # For Flutter apps:
          flutter build ios --release --no-codesign
          
          # For React Native / Native iOS (Uncomment below if needed):
          # xcodebuild -workspace ios/YourApp.xcworkspace -scheme YourApp -configuration Release CODE_SIGNING_ALLOWED=NO
      - name: Package into IPA
        script: |
          # Create the required Payload directory structure
          mkdir -p Payload
          # Copy the compiled .app bundle into Payload (adjust path if native iOS)
          cp -r build/ios/iphoneos/Runner.app Payload/
          # Zip it into an .ipa file
          zip -r YourApp_Unsigned.ipa Payload
    artifacts:
      - "*.ipa"
